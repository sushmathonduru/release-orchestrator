version: "3.9"

services:

  # ---------------------------------------------------------------
  # MongoDB - stores release records (application, version, stage,
  # status, approver, timestamps).
  # ---------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: release-orchestrator-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db          # named volume -> data survives container restarts
    networks:
      - orchestrator-net

  # ---------------------------------------------------------------
  # Backend - Node.js/Express REST API for release orchestration
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: release-orchestrator-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/release_orchestrator
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - orchestrator-net

  # ---------------------------------------------------------------
  # Frontend - static dashboard served by nginx, proxies /api calls
  # to the backend services
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: release-orchestrator-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - orchestrator-net

networks:
  orchestrator-net:
    driver: bridge

volumes:
  mongo_data:
